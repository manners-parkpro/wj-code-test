plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wjc'
version = '0.0.1-SNAPSHOT'
description = 'code-test'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

/**
 * 문제 : 설계에 대한 문제
 *      - 불필요한 Lombok 버전 관리 시도
 *
 * 원인 : 설정
 * 개선안 : io.spring.dependency-management에서 버전관리를 자동으로 하기 때문에 굳이 불 필요한 버전을 넣어 번거롭게 관리하지 않아도 된다고 판단 된다.
 */
def lombokVersion = '1.18.26'

repositories {
    mavenCentral()
}

dependencies {
    /**
     * 문제 : 설정에 대한 문제
     *      - 이미 의존성이 존재 하지만, 중복 코드가 발생하고 있다.
     *      - 유지보수에 있어 혼란을 초래할수 있다.
     * 원인 : 설정
     * 개선안 : 내부적으로 org.springframework.boot:spring-boot-starter에 의존성이 존재하기 때문에 삭제해야 된다고 판단 된다.
     */
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'

    // Lombok
    /**
     * 문제 : 설정에 대한 문제
     *      - 의존성에 버전을 직접 명시하여 버전 관리 부담이 증가 한다.
     *      - 의존성 표기 방식이 일관되지 않아 가독성과 유지보수성이 저하 될 수 있다.
     *      - 불필요한 수동 관리로 인해 변경 시 실수 가능성이 존재 한다.
     *
     * 원인 : 설정
     *      - Spring Boot Dependency Management(BOM)의 역할을 고려하지 않고 개별 의존성에 버전을 명시되어 있다.
     *      - 팀 차원의 의존성 작성 규칙이 명확하게 정립되지 않은것으로 보인다.
     *
     * 개선안
     *      1. Spring Boot가 제공하는 Dependency Management에 버전 관리를 위임한다.
     *      2. 의존성 선언 시 버전을 제거하여 Boot가 검증한 호환 버전을 사용한다.
     *      3. 아래와 같이 그룹과 아티팩트만 명시하여 일관된 의존성 선언 방식을 유지한다.
     *
     *      implementation 'org.projectlombok:lombok'
     */
    compileOnly    "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    /**
     * 문제 : 설정에 대한 누락 문제
     *      - Test 환경에서 Lombok 사용에 대한 고려성이 없음
     * 원인 : 설정
     * 개선안 : 아래의 의존성을 추가하여 테스트코드에서의 Lombok 사용 및 가독성을 향상시킨다.
     *
     * testCompileOnly 'org.projectlombok:lombok'
     * testAnnotationProcessor 'org.projectlombok:lombok'
     */

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
