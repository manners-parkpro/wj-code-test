plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wjc'
version = '0.0.1-SNAPSHOT'
description = 'code-test'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

/**
 * 문제 : 불필요한 Lombok 버전 관리 시도
 * 해결 : io.spring.dependency-management에서 버전관리를 자동으로 하기 때문에 굳이 불 필요한 버전을 넣어 번거롭게 관리하지 않아도 됨.
 */
def lombokVersion = '1.18.26'

repositories {
    mavenCentral()
}

dependencies {
    /**
     * 문제 : 내부적으로 org.springframework.boot:spring-boot-starter가 존재하지만 명시적으로 작성하고 있음
     * 해결 : 삭제
     */
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'

    // Lombok
    /**
     * 문제
     *  1. 버전관리에 번거로움 발생
     *  2. 작성코드에 일관성이 없음. ( "" 보다는 '' 가 올바른 표기이다. ) 따라서 버전관리에 작성이 없다면 일관성 유지
     *  3. 들여쓰기에 문제점
     * 해결 : 버전 정보를 제거하여 Spring Boot 관리하에 두는것이 올바름, 버전을 적지 않아도 자동으로 최적의 버전이 설정 됨.
     * 개선 : org.projectlombok:lombok <- 왼쪽과 같이 기재함으로써 버전관리 자동화를 통해 불필요한 리소스 낭비 절약
     */
    compileOnly    "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    /**
     * 문제 : Test 환경에서 Lombok 사용에 대한 고려성이 없음
     * 해결 : 아래의 의존성을 추가하여 테스트코드에서의 Lombok 사용 및 가독성을 향상시킨다.
     *
     * testCompileOnly 'org.projectlombok:lombok'
     * testAnnotationProcessor 'org.projectlombok:lombok'
     */

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
