# \uBB38\uC81C : \uC124\uC815\uC5D0 \uAD00\uD55C \uBB38\uC81C
#   - local, dev, prod\uC5D0 \uAD00\uD55C \uC124\uC815\uC774 \uC874\uC7AC \uD558\uC9C0 \uC54A\uACE0 \uC788\uB294\uAC78\uB85C \uBCF4\uC784.
# \uC6D0\uC778 : \uC124\uC815
#   - \uAC1C\uBC1C \uD3B8\uC758\uC131\uC744 \uC6B0\uC120\uD558\uC5EC Profile \uAE30\uBC18 \uC124\uC815 \uC804\uB7B5\uC744 \uC801\uC6A9\uD558\uC9C0 \uC54A\uACE0 \uC788\uB2E4.
# \uAC1C\uC120\uC548
# 1. Spring Profile\uC744 \uD65C\uC6A9\uD558\uC5EC \uD658\uACBD\uBCC4 \uC124\uC815 \uD30C\uC77C\uC744 \uBD84\uB9AC\uD558\uB294 \uAC83\uC774 \uC62C\uBC14\uB974\uB2E4\uACE0 \uD310\uB2E8\uB41C\uB2E4.
#   1-1. application-local, application-dev, application-prod
# 2. \uD658\uACBD\uBCC4\uB85C \uB2EC\uB77C\uC9C0\uB294 \uD56D\uBAA9(DB, JPA \uC635\uC158 \uB4F1)\uC740 Profile\uBCC4\uB85C \uAD00\uB9AC\uD558\uC5EC \uC124\uC815 \uBCC0\uACBD\uC5D0 \uB530\uB978 \uC601\uD5A5 \uBC94\uC704\uB97C \uCD5C\uC18C\uD654\uD558\uB294 \uAC83\uC774 \uBC14\uB78C\uC9C1 \uD558\uB2E4\uACE0 \uD310\uB2E8\uB41C\uB2E4.
spring.application.name=code-test

# --- H2 DataSource ---
spring.datasource.url=jdbc:h2:mem:codetest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---

# \uBB38\uC81C : \uC124\uC815\uC5D0 \uAD00\uD55C \uBB38\uC81C
#   1. JPA \uC124\uC815(ddl-auto, show-sql \uB4F1)\uC774 \uD658\uACBD \uAD6C\uBD84 \uC5C6\uC774 \uB3D9\uC77C\uD558\uAC8C \uC801\uC6A9\uB418\uACE0 \uC788\uB2E4.
#   2. \uC6B4\uC601 \uD658\uACBD\uC5D0\uC11C\uB3C4 \uAC1C\uBC1C \uD658\uACBD\uC6A9 \uC124\uC815\uC774 \uC801\uC6A9\uB420 \uC704\uD5D8\uC774 \uD06C\uAC8C \uC874\uC7AC\uD55C\uB2E4.
# \uC6D0\uC778 : \uC124\uC815
#   - \uD658\uACBD\uBCC4\uB85C \uBD84\uB9AC \uAD00\uB9AC\uD574\uC57C \uD560 JPA \uC124\uC815\uC744 \uB2E8\uC77C \uC124\uC815 \uD30C\uC77C\uC5D0\uC11C \uACF5\uD1B5\uC73C\uB85C \uAD00\uB9AC\uD558\uACE0 \uC788\uB2E4.
# \uAC1C\uC120\uC548 : Spring Profile\uC744 \uC0AC\uC6A9\uD558\uC5EC JPA \uC124\uC815\uC744 \uD658\uACBD\uBCC4\uB85C \uBD84\uB9AC\uD55C\uB2E4. \uC774\uB97C \uD1B5\uD574 \uD658\uACBD\uBCC4 \uD2B9\uC131\uC5D0 \uB9DE\uB294 \uC124\uC815\uC744 \uC801\uC6A9\uD558\uACE0, \uC6B4\uC601 \uB9AC\uC2A4\uD06C\uB97C \uCD5C\uC18C\uD654 \uD558\uACE0 \uC608\uBC29\uD574\uC57C \uB41C\uB2E4\uACE0 \uD310\uB2E8\uB41C\uB2E4.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# \uBB38\uC81C : \uC124\uC815\uC5D0 \uAD00\uD55C \uBB38\uC81C
#   - H2\uB97C MODE=MySQL\uB85C \uC0AC\uC6A9\uD558\uBA74\uC11C H2Dialect\uB97C \uBA85\uC2DC\uD558\uACE0 \uC788\uC5B4, \uC2E4\uC81C MySQL \uD658\uACBD\uACFC\uC758 SQL \uB3D9\uC791 \uCC28\uC774\uB85C \uC778\uD55C \uC774\uC288\uAC00 \uBC1C\uC0DD\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.
# \uC6D0\uC778 : \uC124\uC815
#   - \uD14C\uC2A4\uD2B8 DB\uC640 \uC6B4\uC601 DB \uAC04 \uD638\uD658\uC131\uC5D0 \uB300\uD55C \uBA85\uD655\uD55C \uAE30\uC900 \uBC0F \uC804\uB7B5 \uBD80\uC7AC
# \uAC1C\uC120\uC548 : \uD14C\uC2A4\uD2B8 \uBAA9\uC801\uC774\uB77C\uBA74 H2 \uC804\uC6A9 \uC124\uC815\uC784\uC744 \uBA85\uD655\uD788 \uD558\uACE0, Dialect \uC0AC\uC6A9 \uBC94\uC704\uB97C \uC81C\uD55C\uD558\uB294 \uAC83\uC774 \uBC14\uB78C\uC9C1\uD558\uB2E4\uACE0 \uD310\uB2E8\uB41C\uB2E4.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- SQL init (disable if you don?t have schema.sql/data.sql) ---
spring.sql.init.mode=never
